<!--Container principal-->
<main class="d-flex vh-100 vw-100 overflow-hidden">

  <!--sidebar-->  
  <aside class="sidebar-container d-flex flex-column p-4">
    <header class="mb-5">
      <h2 class="brand-font m-0 fw-bold text-white">VETOR<br>URBANO</h2>
      <span class="badge bg-danger mt-2">v0.3.0-alpha</span>
    </header>

    <!--navegação-->  
    <nav class="flex-grow-1">
      <p class="text-uppercase text-secondary small fw-bold mb-3" style="letter-spacing: 1px;">Operações</p>
      <div class="list-group list-group-flush bg-transparent">
        <button type="button" class="list-group-item list-group-item-action bg-transparent text-white border-0 px-0 fw-medium">
          Mapa ao Vivo
        </button>
        <button type="button" class="list-group-item list-group-item-action bg-transparent text-secondary border-0 px-0 fw-medium">
          Fila de Moderação
        </button>
      </div>
    </nav>

    <!--rodapé-->
    <footer class="mt-auto pt-3 border-top border-secondary border-opacity-25">
      <div class="d-flex align-items-center">
        <div class="rounded-circle bg-secondary me-2" style="width: 32px; height: 32px;"></div>
        <small class="text-light fw-medium">Operador Rio</small>
      </div>
    </footer>
  </aside>

  <!--mapa-->
  <section class="flex-grow-1 position-relative">
    <div id="map" class="w-100 h-100"></div>
  </section>

</main>
